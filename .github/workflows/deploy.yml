name: Continuous Deployment to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -Eeuo pipefail
            trap 'echo "❌ Deployment failed at line $LINENO. Exiting..."' ERR

            echo "🚀 Starting automatic deployment on VPS..."

            # 0. Ensure swap file exists to prevent OOM (Out Of Memory) crashes during npm build
            if [ -f /swapfile ]; then
              echo "✅ Swapfile already exists."
            else
              echo "⚠️ No swapfile found. Creating 2GB swapfile to prevent OOM errors..."
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
              echo "✅ Swapfile created and enabled successfully."
            fi

            cd /var/www/visahouse

            # 1. Pull the latest commits from GitHub without deploying a divergent tree
            git config --global --add safe.directory /var/www/visahouse
            git fetch --prune origin main
            git checkout main
            if [ -n "$(git status --porcelain)" ]; then
              echo "⚠️ Local VPS checkout has uncommitted changes. Stashing before deployment reset..."
              git stash push --include-untracked -m "pre-deploy-$(date -u +%Y%m%d%H%M%S)" || true
            fi
            git reset --hard origin/main
            git clean -fd

            # 2. Update backend virtual environment & run migrations
            cd backend
            if [ ! -d ".venv" ]; then
              echo "⚠️ Virtual environment not found. Creating one..."
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m alembic upgrade head
            cd ..

            # 3. Re-install packages and rebuild frontend
            cd frontend
            npm ci
            npm run build
            cd ..

            # 4. Install the service definition and reset writable permissions
            cp deploy/visahouse-backend.service /etc/systemd/system/visahouse-backend.service
            systemctl daemon-reload
            mkdir -p /var/www/visahouse/storage /var/www/visahouse/data /var/www/visahouse/backend/storage
            chown -R www-data:www-data /var/www/visahouse/storage /var/www/visahouse/data /var/www/visahouse/backend/storage
            chmod -R g+rwX /var/www/visahouse/storage /var/www/visahouse/data /var/www/visahouse/backend/storage

            # 5. Restart backend and block deployment if DB-backed health fails
            systemctl restart visahouse-backend
            for attempt in $(seq 1 30); do
              if curl -fsS -H "Host: thecodemate.tech" http://127.0.0.1:8000/health/db >/dev/null; then
                echo "✅ Backend and database are healthy."
                break
              fi
              if [ "$attempt" = "30" ]; then
                echo "❌ Backend health check failed. Recent service logs:"
                journalctl -u visahouse-backend -n 120 --no-pager || true
                exit 1
              fi
              sleep 2
            done

            nginx -t
            systemctl reload nginx

            echo "✨ Deployment successful!"
