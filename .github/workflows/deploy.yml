name: Continuous Deployment to Hostinger VPS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST || secrets.VPS_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEVELOPER_ACCESS_SLUG: ${{ secrets.DEVELOPER_ACCESS_SLUG }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: SSH_PRIVATE_KEY secret is not configured"
            echo "Please add SSH_PRIVATE_KEY to repository secrets"
            exit 1
          fi
          if [ -z "$DEPLOY_HOST" ]; then
            echo "❌ Error: VPS_HOST or VPS_IP secret is not configured"
            echo "Please add VPS_HOST, or keep the existing VPS_IP repository secret"
            exit 1
          fi
          if [ -z "$DEVELOPER_ACCESS_SLUG" ]; then
            echo "❌ Error: DEVELOPER_ACCESS_SLUG secret is not configured"
            echo "Please add DEVELOPER_ACCESS_SLUG to repository secrets"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Deploy to Hostinger VPS via SSH with Retry
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEVELOPER_ACCESS_SLUG: ${{ secrets.DEVELOPER_ACCESS_SLUG }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          TARGET_PORT="${VPS_PORT:-22}"

          for attempt in {1..10}; do
            echo "🚀 SSH Connection Attempt $attempt/10 to VPS (Port $TARGET_PORT)..."
            if ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$TARGET_PORT" root@"$VPS_HOST" 'bash -s' "$DEVELOPER_ACCESS_SLUG" << 'EOF'
            set -Eeuo pipefail
            DEVELOPER_ACCESS_SLUG="$1"
            export DEVELOPER_ACCESS_SLUG
            trap 'echo "❌ Deployment failed at line $LINENO. Exiting..."' ERR

            echo "🚀 Starting automatic deployment on VPS..."

            # 0. Ensure swap file exists to prevent OOM
            if [ -f /swapfile ]; then
              echo "✅ Swapfile already exists."
            else
              echo "⚠️ No swapfile found. Creating 2GB swapfile..."
              fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
              echo "✅ Swapfile created."
            fi

            cd /var/www/visahouse

            # 1. Pull latest code
            git config --global --add safe.directory /var/www/visahouse
            git fetch --prune origin main
            git checkout main
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "⚠️ Local VPS checkout has tracked changes. Stashing..."
              git stash push -m "pre-deploy-$(date -u +%Y%m%d%H%M%S)" || true
            fi
            git reset --hard origin/main
            # Persistent uploads, GeoIP data, environment configuration, and
            # database files must survive every checkout cleanup.
            git clean -fd \
              -e data/ \
              -e storage/ \
              -e backend/storage/ \
              -e backend/.env \
              -e '*.db'

            # 2. Update backend virtual environment & migrations
            cd backend
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            
            # Write/update DEVELOPER_ACCESS_SLUG in backend/.env
            if [ -n "${DEVELOPER_ACCESS_SLUG}" ]; then
              if [ ! -f .env ]; then
                echo "DEVELOPER_ACCESS_SLUG=${DEVELOPER_ACCESS_SLUG}" > .env
              else
                if grep -q "^DEVELOPER_ACCESS_SLUG=" .env; then
                  python3 -c "import os; slug=os.environ['DEVELOPER_ACCESS_SLUG']; lines=[(f'DEVELOPER_ACCESS_SLUG={slug}' if l.startswith('DEVELOPER_ACCESS_SLUG=') else l) for l in open('.env').read().splitlines()]; open('.env','w').write('\n'.join(lines)+'\n')"
                else
                  echo "DEVELOPER_ACCESS_SLUG=${DEVELOPER_ACCESS_SLUG}" >> .env
                fi
              fi
              echo "✅ Configured DEVELOPER_ACCESS_SLUG in backend/.env"
            fi
            
            python -m alembic upgrade head
            cd ..

            # 3. Frontend clean install & build
            cd frontend
            
            # Generate or update .env.production with the developer access slug
            echo "VITE_API_BASE_URL=/api" > .env.production
            echo "VITE_DEVELOPER_ACCESS_SLUG=${DEVELOPER_ACCESS_SLUG}" >> .env.production
            
            rm -rf node_modules
            npm ci || (rm -rf node_modules && npm install)
            npm run build
            cd ..

            # 4. Service definition & permissions
            cp deploy/visahouse-backend.service /etc/systemd/system/visahouse-backend.service
            systemctl daemon-reload
            mkdir -p /var/www/visahouse/storage /var/www/visahouse/data /var/www/visahouse/backend/storage
            chown -R www-data:www-data /var/www/visahouse/storage /var/www/visahouse/data /var/www/visahouse/backend/storage
            chmod -R g+rwX /var/www/visahouse/storage /var/www/visahouse/data /var/www/visahouse/backend/storage

            # 5. Restart backend & verify DB health
            systemctl restart visahouse-backend
            for a in $(seq 1 30); do
              if curl -fsS -H "Host: thecodemate.tech" http://127.0.0.1:8000/health/db >/dev/null 2>&1; then
                echo "✅ Backend and database are healthy."
                break
              fi
              if [ "$a" = "30" ]; then
                echo "❌ Backend health check failed. Service logs:"
                journalctl -u visahouse-backend -n 120 --no-pager || true
                exit 1
              fi
              echo "⏳ Health check attempt $a/30, retrying in 2s..."
              sleep 2
            done

            nginx -t
            systemctl reload nginx

            echo "✨ Deployment successful!"
          EOF
            then
              echo "✅ SSH Deployment completed successfully."
              exit 0
            fi

            echo "⚠️ Connection attempt $attempt failed. Waiting 12 seconds before retry..."
            sleep 12
          done

          echo "❌ All 10 SSH connection attempts failed."
          exit 1
