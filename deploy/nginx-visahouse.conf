server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Frontend build files
    root /var/www/visahouse/frontend/dist;
    index index.html;

    # Handle client-side SPA routing in Vite/React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve user uploads (audio recordings, PDFs) directly via Nginx for speed
    location /storage/ {
        alias /var/www/visahouse/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # TIER 1: Preserve /api prefix specifically for payment gateway webhooks
    # Razorpay expects POST to /api/v1/payments/webhook/razorpay
    location /api/v1/payments/webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TIER 2: Strip /api prefix for normal API endpoints
    # e.g., /api/auth/login -> http://127.0.0.1:8000/auth/login
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Increase maximum upload limits for audio recordings and student files
    client_max_body_size 50M;
}
