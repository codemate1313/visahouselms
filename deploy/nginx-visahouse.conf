server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https: https://cdn.razorpay.com https://*.razorpay.com https://*.stripe.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https:; connect-src 'self' https: https://*.razorpay.com https://*.razorpay.in https://*.stripe.com https://api.stripe.com; script-src 'self' https://checkout.razorpay.com https://checkout-static.razorpay.com https://cdn.razorpay.com https://api.razorpay.com https://*.razorpay.com https://*.razorpay.in https://js.stripe.com https://*.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://checkout.razorpay.com https://checkout-static.razorpay.com https://api.razorpay.com https://*.razorpay.com https://*.razorpay.in https://js.stripe.com https://hooks.stripe.com https://*.stripe.com; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Frontend build files
    root /var/www/visahouse/frontend/dist;
    index index.html;

    # Handle client-side SPA routing in Vite/React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve user uploads (audio recordings, PDFs) directly via Nginx for speed
    location /storage/ {
        alias /var/www/visahouse/storage/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # TIER 1: Preserve /api prefix specifically for payment gateway webhooks.
    # The 127.0.0.1 target is server-internal loopback only; it is not a
    # browser-facing origin.
    # Razorpay expects POST to /api/v1/payments/webhook/razorpay
    location /api/v1/payments/webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TIER 2: Strip /api prefix for normal API endpoints
    # e.g., /api/auth/login -> http://127.0.0.1:8000/auth/login
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Increase maximum upload limits for audio recordings and student files
    client_max_body_size 50M;
}
